<script>
// An embedded page is the phone and nothing else: no dark page, no padding.
// The phone keeps its 375 x 812 drawing size and is scaled whole, so every
// part of it grows and shrinks together with the frame it was given.
if (window.self !== window.top) {
  document.documentElement.className += ' embedded';
  (function () {
    var DRAWN_WIDTH = 375, DRAWN_HEIGHT = 812;
    function fit() {
      var room = Math.min(
        window.innerWidth / DRAWN_WIDTH,
        window.innerHeight / DRAWN_HEIGHT
      );
      // A frame with no width or height yet would scale the phone away
      // entirely; leave the last good size until real room arrives.
      if (!(room > 0) || !isFinite(room)) return;
      document.documentElement.style.setProperty('--fit', room);
    }
    fit();
    window.addEventListener('resize', fit);
    if (window.visualViewport) window.visualViewport.addEventListener('resize', fit);
  })();
}
</script>

<style>
  :root {
    --ink: #23252b;
    --muted: #b9bdc4;
    --teal: #34aec5;
    --green: #3dbb78;
    --blue: #4fc3d9;
    --track: #ececec;
    --line: #e8eaee;
    --card: #ffffff;
    --app-bg: #ffffff;
    --font: "Nunito Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column; gap: 14px;
    align-items: center; justify-content: center; padding: 30px 10px;
    background: #16171a; font-family: var(--font);
  }
  .caption { color: #6b7078; font-size: 12px; letter-spacing: .02em; }

  #device {
    width: 375px; height: 812px; position: relative; overflow: hidden;
    border-radius: 44px; background: var(--app-bg); color: var(--ink);
    box-shadow: 0 24px 70px rgba(0,0,0,.55);
  }

  /* embed mode: the frame holds the phone and nothing else, at any size.
     --fit is set by the script in the head, and is how many times bigger or
     smaller than 375 x 812 the phone is drawn. */
  html.embedded, html.embedded body {
    margin: 0; padding: 0; gap: 0; min-height: 0;
    display: block; background: transparent; overflow: hidden;
  }
  html.embedded #device {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(var(--fit, 1));
    transform-origin: center center;
    border-radius: 0; box-shadow: none;
  }

  #statusbar {
    position: absolute; top: 0; left: 0; right: 0; height: 48px; z-index: 60;
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 34px 0; font-size: 15px; font-weight: 800; pointer-events: none;
  }
  #statusbar .icons { display: flex; align-items: center; gap: 6px; }

  .screen {
    position: absolute; inset: 0; background: var(--app-bg);
    transform: translateX(100%); transition: transform .34s cubic-bezier(.4,0,.2,1);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .screen.base { transform: translateX(0); }
  .screen.in   { transform: translateX(0); }

  .detail-head { flex: none; padding: 60px 22px 0; display: flex; align-items: flex-start; gap: 8px; }
  .head-body { flex: 1; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
  /* the course header has no back arrow, and its divider runs the full width of the phone */
  .course-head { padding-bottom: 16px; border-bottom: 1px solid var(--line); }
  .course-head .head-body { padding-bottom: 0; border-bottom: 0; }
  .head-title { text-align: center; font-weight: 800; font-size: 15px; margin: 4px 0 12px; }
  .hbar { height: 6px; border-radius: 3px; background: var(--track); overflow: hidden; }
  .hbar > i { display: block; height: 100%; width: 0; background: var(--blue); border-radius: 3px;
              transition: width 1.1s cubic-bezier(.4,0,.2,1); }

  /* the level's name, sitting under the course header as the list's heading */
  /* the whole level heading is one button that opens the level menu: 16px on every side,
     and a full-width divider below that matches the course header's */
  .level-toggle {
    flex: none; display: flex; align-items: center; gap: 10px; width: 100%; padding: 16px;
    border: 0; border-bottom: 1px solid var(--line); background: none; font: inherit; color: inherit; text-align: left; cursor: pointer;
  }
  .level-toggle .toggle-chev { color: var(--muted); flex: none; margin-left: auto; transition: transform .3s cubic-bezier(.4,0,.2,1); }
  .level-toggle[aria-expanded="true"] .toggle-chev { transform: rotate(180deg); }
  .head-eyebrow { display: flex; flex-direction: column; gap: 2px; }
  .head-eyebrow .lvl { color: var(--teal); font-weight: 900; font-size: 12px; letter-spacing: .05em; }
  .head-eyebrow .lbl { font-weight: 900; font-size: 18px; }

  /* the chapter list, with the level menu sliding down over it */
  .level-area { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .level-scrim {
    position: absolute; inset: 0; background: rgba(20,24,40,.28);
    opacity: 0; pointer-events: none; transition: opacity .25s ease;
  }
  .level-menu { position: absolute; top: 0; left: 0; right: 0; padding-bottom: 24px; overflow: hidden; pointer-events: none; }
  .level-menu-inner {
    background: var(--app-bg); padding: 4px 0 8px; border-radius: 0 0 14px 14px;
    /* the shadow only shows while open, or it would peek out below the closed menu */
    box-shadow: none;
    transform: translateY(-100%); transition: transform .3s cubic-bezier(.4,0,.2,1), box-shadow .3s ease;
  }
  .level-area.open .level-scrim { opacity: 1; pointer-events: auto; }
  .level-area.open .level-menu { pointer-events: auto; }
  .level-area.open .level-menu-inner { transform: translateY(0); box-shadow: 0 10px 20px rgba(20,24,40,.12); }
  .level-option {
    display: flex; align-items: center; gap: 14px; width: 100%; padding: 18px 26px;
    border: 0; background: none; font: inherit; color: var(--ink); text-align: left; cursor: pointer;
  }
  .level-option:active { background: #eceef1; }
  .level-option .num { color: var(--muted); font-weight: 700; font-size: 15px; }
  .level-option .title { flex: 1; font-weight: 800; font-size: 16px; }
  .level-option.current { background: #f5f6f8; }

  .list { flex: 1; overflow-y: auto; padding: 8px; -webkit-overflow-scrolling: touch; }
  .list::-webkit-scrollbar { display: none; }  .list { scrollbar-width: none; }

  /* each chapter is one tappable card that opens its course screen:
     an empty circle, the chapter number, the title, and an arrow on a light grey card */
  .row {
    display: flex; align-items: center; gap: 12px; width: 100%; padding: 18px 16px;
    margin-bottom: 8px; border: 0; border-radius: 12px; background: #f5f6f8;
    font: inherit; color: var(--ink); text-align: left; cursor: pointer; user-select: none;
    transition: background .15s ease;
  }
  .row:last-child { margin-bottom: 0; }
  .row:active { background: #eceef1; }
  .row .dot { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid #c7cbd1; flex: none; }
  /* a finished chapter fills its circle */
  .row.done .dot { background: var(--green); border-color: var(--green); }
  .row .num { flex: none; width: 18px; color: var(--muted); font-weight: 900; font-size: 15px; }
  .row .title { flex: 1; min-width: 0; font-weight: 700; font-size: 15px; }
  .chev { color: var(--muted); flex: none; }

  /* course screen, drawn from the "Voiceover - Playing" frame in the
     Course - Top Bar - Navigation Figma file. The page content is stand-in text. */
  .course-top { flex: none; background: #fafbfb; padding-top: 44px; border-bottom: 1px solid rgba(33,51,63,.1); }
  .course-top-row { height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 8px; }
  .exit {
    display: flex; align-items: center; gap: 8px; height: 42px; padding: 0; border: 0; border-radius: 6px;
    background: none; color: #2689ca; font: 900 13px/13px var(--font); cursor: pointer;
  }
  .exit .ico { width: 14px; height: 42px; display: flex; align-items: center; justify-content: center; }
  .course-meta { display: flex; align-items: center; }
  .location { padding: 0 8px; color: #21333f; font: 600 12px/14.4px var(--font); }
  .voiceover { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; }

  .pages { flex: 1; min-height: 0; overflow: hidden; }
  .pages-track { display: flex; height: 100%; transition: transform .34s cubic-bezier(.4,0,.2,1); }
  .page { flex: 0 0 100%; height: 100%; overflow-y: auto; padding: 24px 24px 32px; color: #000; }
  .page::-webkit-scrollbar { display: none; }  .page { scrollbar-width: none; }
  .page-img { display: block; width: 100%; height: 194px; object-fit: cover; object-position: 50% 100%; margin-bottom: 22px; }
  .page h1 { margin: 0 0 8px; font: 800 28px/36.4px var(--font); }
  .page p { margin: 0 0 25.6px; font: 400 16px/25.6px var(--font); }

  .course-nav {
    flex: none; height: 96px; display: flex; gap: 8px; padding: 5px 4px 40px;
    background: #fafbfb; border-top: 1px solid rgba(33,51,63,.1);
  }
  .course-nav button {
    flex: 1; height: 44px; display: flex; align-items: center; padding: 8px 16px;
    border: 0; border-radius: 6px; background: rgba(255,255,255,.01); cursor: pointer;
    transition: opacity .15s ease;
  }
  .course-nav #page-next { justify-content: flex-end; }
  .course-nav button:disabled { opacity: .3; cursor: default; }
</style>

<script>
(function () {
  var panel = document.getElementById('panel');

  // inside someone else's iframe, an embed should show only the phone
  if (window.self !== window.top) {
    panel.style.display = 'none';
    return;
  }

  var ceBtn = document.getElementById('copy-embed');
  var CE_SNIPPET = '<iframe src="https://prototypes.mablahblah.com/html-conversions/ra-prototype-set/ra-mobile-options-opt1" width="375" height="812" style="border:0" title="RA - Mobile Options · OPT1" loading="lazy"></iframe>';

  // the button has no text label to swap, so success briefly swaps the code
  // glyph for a tick; failure is shown by colour alone (see the CSS states above)
  var CE_ICON_DEFAULT = ceBtn.innerHTML;
  var CE_ICON_CHECK = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="20 6 9 17 4 12"></polyline></svg>';

  var ceResetTimer = null;
  function ceShowState(state) {
    clearTimeout(ceResetTimer);
    ceBtn.dataset.ceState = state;
    ceBtn.innerHTML = state === 'done' ? CE_ICON_CHECK : CE_ICON_DEFAULT;
    ceResetTimer = setTimeout(function () {
      delete ceBtn.dataset.ceState;
      ceBtn.innerHTML = CE_ICON_DEFAULT;
    }, 1800);
  }

  function ceFallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '-1000px';
    ta.style.left = '-1000px';
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, text.length);
    var ok = false;
    try {
      ok = document.execCommand('copy');
    } catch (e) {
      ok = false;
    }
    document.body.removeChild(ta);
    return ok;
  }

  ceBtn.addEventListener('click', function () {
    function finish(ok) {
      ceShowState(ok ? 'done' : 'error');
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(CE_SNIPPET).then(
        function () { finish(true); },
        function () { finish(ceFallbackCopy(CE_SNIPPET)); }
      );
    } else {
      finish(ceFallbackCopy(CE_SNIPPET));
    }
  });
})();
</script>

  const COPY = [
    "Explicabo minima non. Quasi harum minus facilis similique qui quia. Vel qui ratione nam id animi laboriosam corrupti. Minima ad et nobis. Perferendis quisquam culpa voluptatem ipsam in et nemo quas in. Odit et facilis vel qui dolor ab doloribus delectus.",
    "Qui ut molestiae architecto quia aut dolorem reprehenderit. Eius est nemo quam voluptatem in modi provident magnam suscipit. Rerum enim ullam mollitia iusto.",
    "Qui porro aut est omnis. Veritatis debitis explicabo totam non accusamus consequatur praesentium. Et aut quas porro deserunt labore fugiat tempora voluptate qui. Inventore ea cumque ab incidunt eaque sed est."
  ];
  const PAGES = [
    { title: "Dolor facilis eveniet", photo: true },
    { title: "Quasi harum minus" },
    { title: "Vel qui ratione nam", photo: true },
    { title: "Minima ad et nobis" },
    { title: "Odit et facilis" }
  ];
  const track = document.getElementById("pages-track");
  track.innerHTML = PAGES.map(pg => `
    <div class="page">
      ${pg.photo ? `<img class="page-img" src="${PHOTO}" alt="">` : ""}
      <h1>${pg.title}</h1>
      ${COPY.map(t => `<p>${t}</p>`).join("")}
    </div>`).join("");
  const prevBtn = document.getElementById("page-prev");
  const nextBtn = document.getElementById("page-next");
  let page = 0;
  function showPage(n) {
    page = Math.max(0, Math.min(PAGES.length - 1, n));
    track.style.transform = `translateX(${-100 * page}%)`;
    track.children[page].scrollTop = 0;
    document.getElementById("page-count").textContent = `${page + 1} of ${PAGES.length}`;
    prevBtn.disabled = page === 0;
  }
  prevBtn.addEventListener("click", () => showPage(page - 1));
  // moving on from the last page finishes the chapter and returns to the chapter list
  nextBtn.addEventListener("click", () => {
    if (page === PAGES.length - 1) finishChapter();
    else showPage(page + 1);
  });

  let openRow = null, openKey = null;
  function openCourse(row, key) {
    openRow = row; openKey = key;
    showPage(0);
    push("s-course");
  }
  function finishChapter() {
    finished.add(openKey);
    openRow.classList.add("done");
    pop();
  }

  // animate the course header bar on load (as in the original)
  requestAnimationFrame(() => { document.getElementById("headbar").style.width = "42%"; });

  // simple screen stack
  const stack = [];
  function push(id) {
    const el = document.getElementById(id);
    el.style.zIndex = 20 + stack.length; stack.push(id);
    requestAnimationFrame(() => el.classList.add("in"));
  }
  function pop() {
    const id = stack.pop(); if (id) document.getElementById(id).classList.remove("in");
  }
</script>
