<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RA - Mobile Options · OPT3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,wght@0,400;0,600;0,700;0,800;0,900&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #23252b;
    --muted: #b9bdc4;
    --teal: #34aec5;
    --blue: #4fc3d9;
    --track: #ececec;
    --line: #e8eaee;
    --green: #6fcf97;
    --red: #eb5757;
    --card: #ffffff;
    --app-bg: #ffffff;
    --font: "Nunito Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column; gap: 14px;
    align-items: center; justify-content: center; padding: 30px 10px;
    background: #16171a; font-family: var(--font);
  }
  .caption { color: #6b7078; font-size: 12px; letter-spacing: .02em; }

  #device {
    width: 375px; height: 812px; position: relative; overflow: hidden;
    border-radius: 44px; background: var(--app-bg); color: var(--ink);
    box-shadow: 0 24px 70px rgba(0,0,0,.55), 0 0 0 11px #0d0e10, 0 0 0 13px #2a2c31;
  }

  #statusbar {
    position: absolute; top: 0; left: 0; right: 0; height: 48px; z-index: 60;
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 34px 0; font-size: 15px; font-weight: 800; pointer-events: none;
  }
  #statusbar .icons { display: flex; align-items: center; gap: 6px; }

  .screen { position: absolute; inset: 0; background: var(--app-bg); display: flex; flex-direction: column; overflow: hidden; }

  .detail-head { flex: none; padding: 60px 22px 0; display: flex; align-items: flex-start; gap: 8px; }
  .back {
    width: 34px; height: 34px; flex: none; border: 0; background: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center; color: var(--ink); margin-top: -2px;
    border-radius: 50%; transition: background .15s ease;
  }
  .back:active { background: #f0f1f3; }
  .head-body { flex: 1; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
  .head-title { text-align: center; font-weight: 800; font-size: 15px; margin: 4px 0 12px; }
  .hbar { height: 6px; border-radius: 3px; background: var(--track); overflow: hidden; }
  .hbar > i { display: block; height: 100%; width: 0; background: var(--blue); border-radius: 3px;
              transition: width 1.1s cubic-bezier(.4,0,.2,1); }

  .cols { flex: 1; display: flex; overflow: hidden; }

  /* left stepper rail */
  .rail { flex: none; width: 66px; position: relative; overflow-y: auto; padding: 16px 0 40px; }
  .rail::-webkit-scrollbar { display: none; }  .rail { scrollbar-width: none; }
  .rail .track { position: absolute; left: 32px; top: 30px; bottom: 30px; width: 2px; background: var(--line); }
  .step { position: relative; height: 42px; display: flex; align-items: center; gap: 8px; padding-left: 18px; cursor: pointer; }
  .step .ring { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--green); background: #eafaf0; flex: none; z-index: 1; }
  .step .n { font-size: 13px; color: var(--muted); font-weight: 700; }
  .rail .marker { position: absolute; left: 11px; width: 7px; height: 7px; border-radius: 50%; background: var(--red);
                  transition: top .3s cubic-bezier(.4,0,.2,1); z-index: 2; }

  /* right rich list */
  .cols .list { flex: 1; overflow-y: auto; padding: 6px 16px 40px; -webkit-overflow-scrolling: touch; }
  .cols .list::-webkit-scrollbar { display: none; }  .cols .list { scrollbar-width: none; }
  .row {
    background: var(--card); border-radius: 12px; margin-bottom: 12px;
    box-shadow: 0 1px 3px rgba(20,24,40,.05), 0 8px 20px rgba(20,24,40,.05); overflow: hidden;
  }
  .row-main { display: flex; align-items: center; gap: 11px; padding: 15px 14px; cursor: pointer; user-select: none; }
  .row-main .num { width: 14px; color: var(--muted); font-weight: 900; font-size: 15px; text-align: center; }
  .row-main .body { flex: 1; min-width: 0; }
  .row-main .title { font-weight: 800; font-size: 14px; }
  .row-main .mini { height: 4px; width: 62px; border-radius: 2px; background: var(--track); margin-top: 7px; }
  .chev { color: var(--muted); flex: none; transition: transform .3s cubic-bezier(.4,0,.2,1); }
  .row.open .chev { transform: rotate(90deg); }
  .sub { max-height: 0; overflow: hidden; transition: max-height .34s cubic-bezier(.4,0,.2,1); }
  .sub-inner { padding: 2px 12px 12px 39px; }
  .sub-item { display: flex; align-items: center; gap: 10px; padding: 8px 0; color: #5f636b; font-size: 13px; }
  .sub-item .dot { width: 11px; height: 11px; border-radius: 50%; border: 1.5px solid #c7cbd1; flex: none; }
</style>

<div id="device">
  <div id="statusbar">
    <span>9:41</span>
    <span class="icons">
      <svg width="18" height="12" viewBox="0 0 18 12"><g fill="#23252b"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></g></svg>
      <svg width="17" height="12" viewBox="0 0 17 12"><path fill="#23252b" d="M8.5 2.2c2.6 0 5 1 6.8 2.6l1.4-1.5A11.5 11.5 0 0 0 8.5.2 11.5 11.5 0 0 0 .3 3.3l1.4 1.5A9.5 9.5 0 0 1 8.5 2.2zm0 3.6c1.6 0 3.1.6 4.2 1.7l1.4-1.5a8 8 0 0 0-11.2 0l1.4 1.5A5.9 5.9 0 0 1 8.5 5.8zm0 3.5 2.1 2.3-2.1-.1-2.1.1z"/></svg>
      <svg width="26" height="13" viewBox="0 0 26 13"><rect x="0.5" y="0.5" width="22" height="12" rx="3" fill="none" stroke="#23252b" opacity=".4"/><rect x="2.5" y="2.5" width="18" height="8" rx="1.5" fill="#23252b"/><rect x="24" y="4" width="2" height="5" rx="1" fill="#23252b" opacity=".5"/></svg>
    </span>
  </div>

  <div class="screen">
    <div class="detail-head">
      <button class="back" aria-label="Back">
        <svg width="11" height="18" viewBox="0 0 11 18"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M9.5 1.5l-8 7.5 8 7.5"/></svg>
      </button>
      <div class="head-body">
        <div class="head-title">Oklahoma Teen Drivers Ed Course</div>
        <div class="hbar"><i id="headbar"></i></div>
      </div>
    </div>
    <div class="cols">
      <div class="rail" id="rail"></div>
      <div class="list" id="rich-list"></div>
    </div>
  </div>
</div>

<div class="caption">OPT3 — stepper + lesson list</div>

<!-- Copy-embed control (self-contained: style + markup + script) -->
<style>
  #ce-wrap {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 2147483647; /* stays above the prototype's own layers */
  }
  #copy-embed {
    display: inline-flex;
    align-items: center;
    padding: 8px 14px;
    border: 1px solid #33363d;
    border-radius: 8px;
    background: #1e2023;
    color: #b9bdc4;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .02em;
    cursor: pointer;
    transition: background-color .15s ease, color .15s ease, border-color .15s ease;
  }
  #copy-embed:hover {
    background: #26292e;
    color: #e7e8ea;
  }
  #copy-embed[data-ce-state="done"] {
    background: #204a3f;
    color: #7fd9b9;
    border-color: #2c5c4d;
  }
  #copy-embed[data-ce-state="error"] {
    background: #4a2020;
    color: #e29a9a;
    border-color: #5c2c2c;
  }
</style>

<div id="ce-wrap">
  <button type="button" id="copy-embed">Copy embed</button>
</div>

<script>
(function () {
  var ceWrap = document.getElementById('ce-wrap');
  var ceBtn = document.getElementById('copy-embed');

  // Never show this control when the page is loaded inside someone else's iframe
  // (e.g. embedded in a portfolio) — only the top-level viewer should see it.
  if (window.self !== window.top) {
    ceWrap.style.display = 'none';
    return;
  }

  // Placeholders below are substituted per-page at paste time; the address
  // is always the live one, regardless of where this page happens to be viewed.
  var CE_SNIPPET = '<iframe src="https://prototypes.mablahblah.com/ra-mobile-options-opt3" width="395" height="910" style="border:0" title="RA - Mobile Options · OPT3" loading="lazy"></iframe>';

  var ceResetTimer = null;
  function ceShowState(state, label) {
    clearTimeout(ceResetTimer);
    ceBtn.dataset.ceState = state;
    ceBtn.textContent = label;
    ceResetTimer = setTimeout(function () {
      delete ceBtn.dataset.ceState;
      ceBtn.textContent = 'Copy embed';
    }, 1800);
  }

  // Works on insecure origins / older browsers where navigator.clipboard is absent.
  function ceFallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '-1000px';
    ta.style.left = '-1000px';
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, text.length);
    var ok = false;
    try {
      ok = document.execCommand('copy');
    } catch (e) {
      ok = false;
    }
    document.body.removeChild(ta);
    return ok;
  }

  ceBtn.addEventListener('click', function () {
    function finish(ok) {
      ceShowState(ok ? 'done' : 'error', ok ? 'Copied' : 'Copy failed');
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(CE_SNIPPET).then(
        function () { finish(true); },
        function () { finish(ceFallbackCopy(CE_SNIPPET)); }
      );
    } else {
      finish(ceFallbackCopy(CE_SNIPPET));
    }
  });
})();
</script>


<script>
  const LESSONS = [
    "The Beginning", "Permitted to Drive", "Right-of-Ways, ami i right?",
    "It must be a sign", "Let my Traffic Flow", "Driver Responsibility",
    "Traffic Stops", "Now Go Drive", "Let's Assess"
  ];
  const SUBITEMS = ["Intro", "Course Elements", "Additional Resources", "Quiz"];

  // stepper rail 1..15
  const rail = document.getElementById("rail");
  rail.innerHTML = '<div class="track"></div><div class="marker" id="marker"></div>';
  for (let i = 1; i <= 15; i++) {
    const s = document.createElement("div");
    s.className = "step";
    s.innerHTML = `<span class="ring"></span><span class="n">${i}</span>`;
    s.addEventListener("click", () => moveMarker(s));
    rail.appendChild(s);
  }
  function moveMarker(step) {
    const marker = document.getElementById("marker");
    const ring = step.querySelector(".ring");
    marker.style.top = (ring.offsetTop + ring.offsetHeight / 2 - 3.5) + "px";
  }

  // rich accordion list
  const richEl = document.getElementById("rich-list");
  LESSONS.forEach((title, li) => {
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = `
      <div class="row-main">
        <span class="num">${li + 1}</span>
        <div class="body"><div class="title">${title}</div><div class="mini"></div></div>
        <svg class="chev" width="9" height="15" viewBox="0 0 9 15"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M1.5 1.5l6 6-6 6"/></svg>
      </div>
      <div class="sub"><div class="sub-inner">
        ${SUBITEMS.map(s => `<div class="sub-item"><span class="dot"></span>${s}</div>`).join("")}
      </div></div>`;
    const main = row.querySelector(".row-main");
    const sub = row.querySelector(".sub");
    main.addEventListener("click", () => {
      const open = row.classList.toggle("open");
      sub.style.maxHeight = open ? sub.firstElementChild.scrollHeight + "px" : "0";
    });
    richEl.appendChild(row);
  });

  // place marker on step 1, animate header bar on load (as in the original)
  requestAnimationFrame(() => {
    moveMarker(rail.querySelectorAll(".step")[0]);
    document.getElementById("headbar").style.width = "42%";
  });
</script>
